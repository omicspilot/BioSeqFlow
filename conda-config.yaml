name: bioseqflow

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python
  - python=3.11

  # Core scientific stack (prefer conda for binary dependencies)
  - numpy>=1.24.0
  - pandas>=2.0.0
  - matplotlib>=3.7.0
  - seaborn>=0.12.0

  # Bioinformatics tools (available via bioconda)
  - biopython>=1.81

  # Dev tools
  - pre-commit>=3.3.0

  # Pip-only packages (not available or outdated on conda)
  - pip
  - pip:
    - click>=8.0.0
    - plotly>=5.14.0
    - pyyaml>=6.0
    - pydantic>=2.0.0
    - pytest>=7.4.0
    - pytest-cov>=4.1.0
    - pytest-mock>=3.11.0
    - mypy>=1.5.0
    - ruff>=0.1.0
    - black>=23.0.0
    - types-PyYAML
    - -e .
